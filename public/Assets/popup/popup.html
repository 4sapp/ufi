<!DOCTYPE html>
<html lang="es">

<head>
    <title>ufi - Miami Server Finder</title>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-base: #191b1d;
            --bg-card: #232527;
            --border: #313336;
            --text-primary: #ffffff;
            --text-secondary: #9ea1a7;
            --btn-bg: #2b2d30;
            --btn-hover: #36383c;
            --accent: #00a2ff;
            --accent-hover: #008be6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 290px;
            padding: 18px 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .header {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .logo-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.2px;
        }

        .logo-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .info-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 12px;
            line-height: 1.5;
            color: var(--text-secondary);
        }

        .info-card strong {
            color: var(--text-primary);
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: background-color 0.15s ease;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: var(--btn-bg);
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background-color: var(--btn-hover);
        }

        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-secondary);
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .footer a:hover {
            color: var(--text-primary);
        }

        .footer svg {
            width: 13px;
            height: 13px;
            fill: currentColor;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1 class="logo-title">ufi</h1>
            <p class="logo-subtitle">Miami Server Finder</p>
        </div>

        <div class="info-card">
            Busca servidores en <strong>Miami</strong> o con el menor ping directamente desde la pestaña <strong>Servidores</strong> en Roblox.
        </div>

        <div class="actions">
            <button type="button" id="settings-link" class="btn btn-primary">
                Ajustes de la Extensión
            </button>

            <button type="button" id="github-link" class="btn btn-secondary">
                Ver Código en GitHub
            </button>
        </div>

        <div class="footer">
            <span>ufi v2.6.8</span>
            <a href="#" id="github-footer" title="GitHub">
                <svg viewBox="0 0 24 24">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
                </svg>
                <span>4sapp/ufi</span>
            </a>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
